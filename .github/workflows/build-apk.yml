name: Build Android APK (Nuvem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar Licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências
        run: npm ci || npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        run: npm run build

      - name: Copiar Assets Web e Configuração para o App Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Conceder Permissões ao Gradle Wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/glog.txt

      - name: Reportar Log no Summary
        if: always()
        run: |
          if [ -f /tmp/glog.txt ]; then
            echo "### 📋 Log da Compilação Gradle:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 /tmp/glog.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Preparar APK para Download
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/FinanFlow-App-Android.apk || find android/app/build -name "*.apk" -exec cp {} apk_output/FinanFlow-App-Android.apk \;
          echo "### Arquivo APK Gerado com Sucesso! 🚀" >> $GITHUB_STEP_SUMMARY
          ls -la apk_output/FinanFlow-App-Android.apk >> $GITHUB_STEP_SUMMARY

      - name: Enviar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-App-Android
          path: apk_output/FinanFlow-App-Android.apk
          if-no-files-found: error

      - name: Enviar Log de Compilação (Se Falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/glog.txt
          if-no-files-found: ignore
