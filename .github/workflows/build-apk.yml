name: Build Android APK (Nuvem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Frontend Web
        run: npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Conceder Permissões ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Enviar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
