name: Build Android APK (Nuvem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK Nativo
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        run: npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Conceder Permissões ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
