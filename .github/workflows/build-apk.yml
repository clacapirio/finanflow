name: Build Android APK (Nuvem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências
        run: npm ci || npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        run: npm run build

      - name: Copiar Assets Web para o App Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Conceder Permissões ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          set -e -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Reportar Log de Compilação no Summary
        if: always()
        run: |
          echo "### Log Final da Compilação Gradle" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 gradle_build.log 2>/dev/null || echo "Log não encontrado" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Preparar APK para Download
        run: |
          mkdir -p apk_output
          find android/app/build -name "*.apk" -exec cp {} apk_output/FinanFlow-App-Android.apk \;
          echo "### Arquivo APK Gerado:" >> $GITHUB_STEP_SUMMARY
          ls -la apk_output/FinanFlow-App-Android.apk >> $GITHUB_STEP_SUMMARY || echo "Erro ao copiar APK" >> $GITHUB_STEP_SUMMARY

      - name: Enviar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-App-Android
          path: apk_output/FinanFlow-App-Android.apk
          if-no-files-found: warn
