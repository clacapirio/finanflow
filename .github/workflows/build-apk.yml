name: Build Android APK (Nuvem)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências
        run: npm ci || npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        run: npm run build

      - name: Conceder Permissões ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Sincronizar Assets do Capacitor
        run: npx --yes @capacitor/cli sync android

      - name: Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
